name: Build & Release Burp Extension

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    outputs:
      version: ${{ steps.props.outputs.version }}
      filename: ${{ steps.props.outputs.filename }}
      sha256: ${{ steps.props.outputs.sha256 }}
      source-sha: ${{ steps.props.outputs.source-sha }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Committed-diff whitespace checks need the parent revision.
          fetch-depth: 2
          persist-credentials: false

      - name: Set up JDK 21 (Corretto)
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # Keep the existing GitHub-backed cache rather than enabling enhanced caching.
          cache-provider: basic
          # Master builds own the shared cache; other workflows and refs only read it.
          cache-read-only: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/master' }}
          validate-wrappers: true

      - name: Grant Gradle execute permission
        run: chmod +x gradlew

      - name: Verify release workflow regressions
        run: python3 -B -m unittest discover -s .github/tests -v

      - name: Verify Java quality gates
        run: |
          ./gradlew --no-daemon compileJava compileTestJava spotlessCheck spotbugsMain spotbugsTest
          git diff --check HEAD^ HEAD

      - name: Verify Javadoc before packaging
        run: ./gradlew --no-daemon --stacktrace clean javadoc

      - name: Build extension (CI/unit lane)
        run: |
          echo 'CI/unit and packaged-runtime verification excludes integration-tagged tests. Credentialed local integration verification remains required.' >> "$GITHUB_STEP_SUMMARY"
          ./gradlew --no-daemon clean build -PexcludeIntegration

      - name: Print failing tests from JUnit XML
        if: failure()
        run: |
          python3 <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          results_dir = Path("build/test-results/test")
          if not results_dir.is_dir():
              print("No build/test-results/test directory (test task may have aborted early).")
              raise SystemExit(0)

          failures = []
          for xml_path in sorted(results_dir.glob("TEST-*.xml")):
              root = ET.parse(xml_path).getroot()
              for case in root.iter("testcase"):
                  for tag in ("failure", "error"):
                          node = case.find(tag)
                          if node is not None:
                              classname = case.get("classname") or xml_path.stem.removeprefix("TEST-")
                              name = case.get("name") or "?"
                              message = (node.get("message") or node.text or "").strip()
                              failures.append((f"{classname} > {name}", message))

          if not failures:
              print("No JUnit <failure>/<error> entries found under build/test-results/test/.")
          else:
              print(f"Failing tests ({len(failures)}):")
              for label, message in failures:
                  print(f"\n=== {label} ===")
                  print(message if message else "(no message)")
          PY

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            build/reports/tests/test/
            build/test-results/test/
          if-no-files-found: ignore

      - name: Identify verified artifact
        id: props
        run: |
          python3 <<'PY'
          import os
          import hashlib
          import re
          import subprocess
          from pathlib import Path

          props = {}
          for line in Path("gradle.properties").read_text(encoding="utf-8").splitlines():
              line = line.strip()
              if not line or line.startswith("#") or "=" not in line:
                  continue
              key, value = line.split("=", 1)
              props[key.strip()] = value.strip()

          basename, version = props['archivesBaseName'], props['version']
          if not all(re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._-]*', value) for value in (basename, version)):
              raise SystemExit('Unsafe release basename or version')
          filename = f'{basename}-{version}.jar'
          artifact = Path('build/libs') / filename
          if artifact.is_symlink() or not artifact.is_file():
              raise SystemExit('Expected distributable is missing or is a symlink')
          source_sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if source_sha != os.environ['GITHUB_SHA']:
              raise SystemExit('Checkout does not match the workflow commit')
          with artifact.open('rb') as stream:
              digest = hashlib.file_digest(stream, 'sha256').hexdigest()
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write(f'version={version}\nfilename={filename}\nsha256={digest}\nsource-sha={source_sha}\n')
          PY

      - name: Upload verified distributable
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-unit-verified-extension
          path: build/libs/${{ steps.props.outputs.filename }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A newer build may queue publication, but must never interrupt an active handoff.
    concurrency:
      group: release-master
      cancel-in-progress: false
    permissions:
      contents: write
    # No checkout or build scripts run with the release job's write-capable token.
    steps:
      - name: Download verified distributable from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: verified
          merge-multiple: true
          digest-mismatch: error

      - name: Verify artifact and source identity
        env:
          FILENAME: ${{ needs.build.outputs.filename }}
          EXPECTED_SHA256: ${{ needs.build.outputs.sha256 }}
          SOURCE_SHA: ${{ needs.build.outputs.source-sha }}
        run: |
          python3 <<'PY'
          import hashlib
          import os
          import re
          from pathlib import Path

          filename = os.environ['FILENAME']
          if not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._-]*\.jar', filename):
              raise SystemExit('Unsafe artifact filename')
          artifact = Path('verified') / filename
          if artifact.is_symlink() or not artifact.is_file():
              raise SystemExit('Expected verified artifact is missing or is a symlink')
          with artifact.open('rb') as stream:
              digest = hashlib.file_digest(stream, 'sha256').hexdigest()
          if digest != os.environ['EXPECTED_SHA256'] or os.environ['SOURCE_SHA'] != os.environ['GITHUB_SHA']:
              raise SystemExit('Artifact digest or source commit mismatch; release was not modified')
          print(f'Verified {filename}: sha256:{digest}; source {os.environ["SOURCE_SHA"]}')
          PY

      - name: Stage, verify and publish a new build release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          FILENAME: ${{ needs.build.outputs.filename }}
          EXPECTED_SHA256: ${{ needs.build.outputs.sha256 }}
          SOURCE_SHA: ${{ needs.build.outputs.source-sha }}
        run: |
          python3 <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          repo = os.environ['GITHUB_REPOSITORY']
          source = os.environ['SOURCE_SHA']
          version = os.environ['VERSION']
          filename = os.environ['FILENAME']
          run_id, attempt = os.environ['GITHUB_RUN_ID'], os.environ['GITHUB_RUN_ATTEMPT']
          if (os.environ['GITHUB_REF'] != 'refs/heads/master'
                  or os.environ['GITHUB_EVENT_NAME'] not in ('push', 'workflow_dispatch')
                  or source != os.environ['GITHUB_SHA']
                  or not re.fullmatch(r'[0-9a-f]{40}', source)
                  or not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._-]*', version)
                  or not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._-]*\.jar', filename)
                  or not run_id.isdecimal() or not attempt.isdecimal()):
              raise SystemExit('Unsafe publication identity; existing releases were not modified')
          artifact = Path('verified') / filename
          if artifact.is_symlink() or not artifact.is_file():
              raise SystemExit('Verified distributable is missing or is a symlink')
          with artifact.open('rb') as stream:
              digest = hashlib.file_digest(stream, 'sha256').hexdigest()
          if digest != os.environ['EXPECTED_SHA256']:
              raise SystemExit('Distributable digest mismatch; existing releases were not modified')

          def api(method, path, payload=None):
              command = ['gh', 'api', '--method', method, f'repos/{repo}/{path}',
                         '-H', 'Accept: application/vnd.github+json',
                         '-H', 'X-GitHub-Api-Version: 2022-11-28']
              if payload is not None:
                  command.extend(['--input', '-'])
              result = subprocess.run(command, input=json.dumps(payload) if payload is not None else None,
                                      text=True, stdout=subprocess.PIPE, check=True, timeout=120)
              return json.loads(result.stdout)

          def is_current():
              return api('GET', 'git/ref/heads/master')['object']['sha'] == source

          if not is_current():
              print('Superseded build; Latest and existing downloads remain unchanged.')
              raise SystemExit(0)

          # Drafts are not Latest. Never delete or replace any published release or asset.
          tag = f'v{version}-build.{run_id}.{attempt}'
          release = api('POST', 'releases', {
              'tag_name': tag, 'target_commitish': source,
              'name': f'v{version} (build {run_id}.{attempt})',
              'draft': True, 'prerelease': False, 'make_latest': 'false',
              'body': f'Always use the latest.\n\nSource: {source}\nSHA-256: {digest}'})
          release_id = release['id']
          if not release['draft'] or release['tag_name'] != tag or release['target_commitish'] != source:
              raise SystemExit('Draft identity mismatch; existing downloads remain unchanged')
          subprocess.run(['gh', 'release', 'upload', tag, str(artifact), '--repo', repo],
                         check=True, timeout=300)
          staged = api('GET', f'releases/{release_id}')
          assets = staged['assets']
          if (not staged['draft'] or staged['tag_name'] != tag or staged['target_commitish'] != source
                  or len(assets) != 1 or assets[0]['name'] != filename
                  or assets[0]['state'] != 'uploaded' or assets[0]['size'] != artifact.stat().st_size
                  or assets[0].get('digest') != f'sha256:{digest}'):
              raise SystemExit('Uploaded draft verification failed; existing downloads remain unchanged')
          # Publication jobs are serialized; repeat the branch check after the upload as well.
          if not is_current():
              print(f'Superseded during upload; {tag} remains a draft and Latest is unchanged.')
              raise SystemExit(0)
          published = api('PATCH', f'releases/{release_id}', {'draft': False, 'make_latest': 'true'})
          if published['draft'] or published['tag_name'] != tag:
              raise SystemExit('Publication response did not confirm the expected release')
          print(f'Published {tag}; previous downloads retained. {published["html_url"]}')
          PY
